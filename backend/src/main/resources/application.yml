    access-token-expiration-ms: 3600000 # 1 hour
    refresh-token-expiration-ms: 2592000000 # 30 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:426672383514-9o8eijmrdc3p0h0plb9hbv2v6psndv6m.apps.googleusercontent.com}
