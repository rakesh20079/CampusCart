services:
  postgres:
    image: postgres:16-alpine
    container_name: campuscart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_project_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CampusCartPassword@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_project_1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: campuscart-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mini_project_1
      DB_USER: postgres
      DB_PASSWORD: CampusCartPassword@123
      PORT: 8080
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
