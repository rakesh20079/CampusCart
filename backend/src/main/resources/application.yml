server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campus-cart-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mini_project_1}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Rakesh@725374}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

app:
